  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="170" fill="url(#accentGrad)" opacity="0.12"/>
