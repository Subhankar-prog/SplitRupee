<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rupee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="coin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="50" fill="url(#bg-rupee)" />
  <!-- Coin rim outer -->
  <circle cx="50" cy="50" r="36" fill="url(#coin-gold)" />
  <circle cx="50" cy="50" r="32" fill="#B45309" opacity="0.35" />
  <circle cx="50" cy="50" r="29" fill="url(#coin-gold)" />
  <!-- Rupee Symbol -->
  <g fill="#78350F" font-family="Arial, sans-serif" font-weight="900" font-size="34">
    <text x="50" y="62" text-anchor="middle">₹</text>
  </g>
</svg>